sample_period_s: 0.02

surfaces:
  countertop:
    waypoint_pattern: coverage_waypoints_countertop_raster_*.csv
    target_force_n: 10.0
    force_tolerance_n: 2.0
    target_speed_m_s: 0.20
    contact_force_threshold_n: 1.0
    backoff_force_n: 14.0
    approach_speed_m_s: 0.004
    nominal_surface_distance_m: 0.010
    initial_surface_distance_m: 0.030
    target_penetration_m: 0.0028
    max_penetration_m: 0.0035
    max_normal_offset_m: 0.004
    surface_stiffness_n_m: 3600.0
    surface_damping_n_s_m: 12.0
    tool_impedance_stiffness_n_m: 80.0
    tool_impedance_damping_n_s_m: 40.0
    force_to_offset_gain_m_n_s: 0.00004
    backoff_step_m: 0.0006
    obstacle:
      object_name: faucet
      mode: skip
      margin_m: 0.10

  mirror:
    waypoint_pattern: coverage_waypoints_mirror_spiral_*.csv
    target_force_n: 6.0
    force_tolerance_n: 1.5
    target_speed_m_s: 0.15
    contact_force_threshold_n: 1.0
    backoff_force_n: 9.0
    approach_speed_m_s: 0.0035
    nominal_surface_distance_m: 0.009
    initial_surface_distance_m: 0.026
    target_penetration_m: 0.0020
    max_penetration_m: 0.0026
    max_normal_offset_m: 0.0035
    surface_stiffness_n_m: 3000.0
    surface_damping_n_s_m: 10.0
    tool_impedance_stiffness_n_m: 60.0
    tool_impedance_damping_n_s_m: 32.0
    force_to_offset_gain_m_n_s: 0.00003
    backoff_step_m: 0.0006
    disturbance:
      enabled: true
      waypoint_ratio: 0.35
      overload_force_n: 4.0
      duration_samples: 4
